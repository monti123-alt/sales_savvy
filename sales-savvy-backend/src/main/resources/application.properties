# ==========================================
# Sales Savvy - Application Configuration
# ==========================================

# --- Server ---
server.port=${PORT:8080}

# Local developer credentials live in the ignored backend/.env file.
spring.config.import=optional:file:.env[.properties],optional:file:./sales-savvy-backend/.env[.properties]

# --- MySQL DataSource ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sales_savvy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson: send dates as ISO strings instead of timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Multipart / uploads ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
salessavvy.upload-dir=${SALESSAVVY_UPLOAD_DIR:uploads}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Razorpay test key ID is public; provide the matching secret through the environment.
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_RJp1Hu4sOr675l}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# --- AI shopping concierge ---
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1/chat/completions}

# Print our own startup banner
spring.main.banner-mode=console
logging.level.org.springframework.security=INFO
